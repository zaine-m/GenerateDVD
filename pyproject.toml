[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "create-dvd"
version = "0.1.0"
description = "creates a dvd from youtube videos"
readme = "README.md"
authors = [{name = "Zaine", email = "zainemoodie@gmail.com"}]
dependencies = [
    "yt-dlp[default,curl-cffi]",
    "ollama>=0.5.0",
    "pillow",
]

[project.scripts]
generatedvd = "src.main:main"

[tool.setuptools]
packages = ["src"]
